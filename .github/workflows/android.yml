name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 동일 문장 1~5회 반복, 자동/수동 문장 전환과 20초 제한시간
          - 선택한 여러 데이터셋을 체크한 순서대로 이어 학습
          - 오늘/일별/주간/월별/연간/전체 학습량과 학습시간 통계
          - Enter 키로 다음 문장 이동
          - 생활 영어 주요 패턴 50개를 활용한 기본 500문장과 해석
          - scrcpy 미러링 오디오 설정과 오디오 경로 복원 개선
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
