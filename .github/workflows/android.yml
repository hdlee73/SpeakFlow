name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore fixed signing key for installable releases
        if: github.ref == 'refs/heads/main'
        env:
          SPEAKFLOW_SIGNING_KEY: ${{ secrets.SPEAKFLOW_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SPEAKFLOW_SIGNING_KEY" ]; then
            echo "Configure SPEAKFLOW_SIGNING_KEY_BASE64 in repository Actions secrets before publishing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/speakflow-signing"
          printf '%s' "$SPEAKFLOW_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/speakflow-signing/fixed.p12"
          chmod 600 "$RUNNER_TEMP/speakflow-signing/fixed.p12"
          echo "SPEAKFLOW_KEYSTORE_PATH=$RUNNER_TEMP/speakflow-signing/fixed.p12" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$RUNNER_TEMP/speakflow-signing/fixed.p12" -storepass android -alias androiddebugkey -file /tmp/speakflow-cert.der
          actual=$(sha256sum /tmp/speakflow-cert.der | cut -d ' ' -f 1)
          expected=$(tr -d '\r\n' < signing-certificate.sha256)
          test "$actual" = "$expected" || { echo "Signing certificate differs from the fixed release certificate."; exit 1; }
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --no-build-cache
      - name: Verify built APK uses the fixed release certificate
        if: github.ref == 'refs/heads/main'
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/speakflow-apk-certs.txt
          cat /tmp/speakflow-apk-certs.txt
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/speakflow-apk-certs.txt | tr '[:upper:]' '[:lower:]' | sort -u | tr -d ' \r\n')
          expected=$(tr -d '\r\n' < signing-certificate.sha256)
          test "$actual" = "$expected" || { echo "Built APK has the wrong signing certificate ($actual versus $expected); publication blocked."; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 부분 재발음 시 이미 맞힌 단어 유지 및 남은 단어만 평가
          - 실제 설치 음성 선택·미리듣기 및 미국 남성 자동 선택 상태 표시
          - 진행 위치 즉시 저장, 같은 데이터셋 재선택 시 진행 위치 유지
          - 구동사 기본 데이터셋 200문장 추가
          - 블루투스 워치 제외, 선택형 야외 잡음 보정 입력
          - 앱 내 영어 문장·한국어 해석 편집
          - 고정 서명키 검증으로 향후 APK 업데이트 지원
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
