name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 전체 단어 일치와 일부 불일치에 서로 다른 결과 알림음 적용
          - 전체 일치 시 알림음 후 다음 문장 자동 이동, 불일치 시 결과 확인 후 자동 재발음
          - 음성 인식 준비 전 도착하는 이전 세션 콜백을 무시해 재발음 시간이 즉시 끝나는 문제 수정
          - 연결된 블루투스 헤드셋을 기본 마이크로 우선 선택
          - 한국어 듣고 영어 말하기에서는 발화가 끝난 후에만 영문 비교 결과와 해석 표시
          - 점수·자동 이동 설정을 새 결과 동작 안내로 단순화
          - 하단 원형 방향키와 그림자 모양을 일치하도록 수정
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
