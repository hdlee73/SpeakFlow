name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 긴 문장이 중간 침묵으로 조기 종료되지 않도록 발화·침묵 대기시간 조정
          - 음성인식 후보를 8개로 확대하고 가장 정확한 결과로 채점
          - 목표 문장, 주요 단어, 연속 단어를 인식 힌트로 제공
          - 분리 인식된 문장 조각을 결합하여 재평가
          - 직전 실제 인식 문장을 점수 아래에 표시
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
