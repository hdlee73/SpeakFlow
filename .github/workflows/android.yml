name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 화면에서 의미가 불분명한 직전 발음 점수 숨김
          - 실제 인식 문장과 본문의 파란색 단어 표시를 동일한 단어 정렬 결과로 통일
          - 축약형 인식과 유사 단어 허용 범위를 보완하고 기본 통과 기준을 소폭 완화
          - A열에 영어 문장만 있는 Excel·CSV 데이터셋 지원
          - 블루투스 마이크가 실제 준비된 뒤 제한시간을 시작하고 재발음 시 연결 경로 유지
          - 문장 종료 침묵 대기시간을 늘려 긴 문장과 잠깐의 머뭇거림 지원
          - 번역 연습에서 한국어 안내 뒤 발음 중 영어 단어의 인식 상태를 실시간 표시
          - 모든 단어가 인식되면 설정과 관계없이 다음 문장으로 자동 이동
          - 반복 표시가 없을 때 결과 배지를 화면 가운데로 정렬
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
