name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SpeakFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}"
          apk="SpeakFlow-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cat > release-notes.md <<'EOF'
          ## 주요 개선 사항

          - 기기에 설치된 미국 영어 음성 중 가장 자연스러운 고품질 음성을 우선 선택
          - 영어 예문 재생 속도를 0.84배로 낮춰 또렷하고 여유 있게 발음
          - 문장 유형에 맞는 마침표·물음표 억양을 자동 적용
          - 한국어 안내는 자연스러운 0.90배 속도로 별도 조정
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "SpeakFlow $tag" --notes-file release-notes.md
          fi
